-- =============================================================================
-- EYMEN PAŞA İMPARATORLUK DEVLET SİMÜLASYONU: TÜM SİSTEMLER ENTEGRE TEK KOD
-- =============================================================================

local Players = game:GetService("Players")
local Teams = game:GetService("Teams")
local ReplicatedStorage = game:GetService("ReplicatedStorage")
local TweenService = game:GetService("TweenService")

-- -----------------------------------------------------------------------------
-- 1. ADIM: TÜM BRANŞLARIN VE ORDU TAKIMLARININ KURULUMU
-- -----------------------------------------------------------------------------
local function createTeam(name, color)
	if not Teams:FindFirstChild(name) then
		local newTeam = Instance.new("Team")
		newTeam.Name = name
		newTeam.TeamColor = color
		newTeam.AutoAssignable = false
		newTeam.Parent = Teams
	end
end

createTeam("Padişah ve Paşalar", BrickColor.new("Bright yellow"))
createTeam("Ordu Subayları", BrickColor.new("Deep orange"))
createTeam("Osmanlı Ordusu", BrickColor.new("Dark green"))
createTeam("Harekat Alayı", BrickColor.new("Burgundy"))
createTeam("Zaptiye Amirliği", BrickColor.new("Bright blue"))
createTeam("Tayyare Bölüğü", BrickColor.new("Light blue"))
createTeam("Bahriye Bölüğü", BrickColor.new("Deep blue"))
createTeam("Vatandaşlar / Örgütler", BrickColor.new("White"))

-- -----------------------------------------------------------------------------
-- 2. ADIM: KODLA HARİTA İNŞA ETME MOTORU (BUILDER)
-- -----------------------------------------------------------------------------
local Harita = Instance.new("Folder")
Harita.Name = "EymenPasa_Imparatorluk_Haritasi"
Harita.Parent = workspace

local function buildPart(name, pos, size, color, material, parent)
	local part = Instance.new("Part")
	part.Name = name
	part.Position = pos
	part.Size = size
	part.BrickColor = BrickColor.new(color)
	part.Material = material or Enum.Material.SmoothPlastic
	part.Anchored = true
	part.Parent = parent or Harita
	return part
end

-- A) YOLLAR
buildPart("Ana_Yol_Merkez", Vector3.new(0, 0.5, 0), Vector3.new(30, 1, 600), "Dark stone grey", Enum.Material.Asphalt)
buildPart("Yol_Harekat", Vector3.new(-80, 0.5, -150), Vector3.new(130, 1, 20), "Dark stone grey", Enum.Material.Asphalt)

-- B) HAREKAT ALAYI ÜSSÜ
buildPart("Harekat_Ana_Bina", Vector3.new(-150, 15, -150), Vector3.new(70, 30, 70), "Burgundy", Enum.Material.Concrete)

-- C) ZAPTİYE AMİRLİĞİ VE HAPİSHANE

-- D) TAYYARE BÖLÜĞÜ VE DEVASA UÇUŞ PİSTİ
buildPart("Tayyare_Hangari", Vector3.new(150, 15, -50), Vector3.new(60, 30, 60), "Light blue", Enum.Material.Concrete)

-- E) DEVAŞA YILDIZ SARAYI

-- Saray İçi Odalar
buildPart("Padişah_Odasi", Vector3.new(0, 50, -250), Vector3.new(40, 20, 40), "Bright yellow", Enum.Material.Marble)

-- F) DENETİM, STS VE EĞİTİM ALANI
buildPart("Egitim_Ve_Talim_Alani", Vector3.new(-60, 0.5, -30), Vector3.new(80, 1, 80), "Dark green", Enum.Material.Grass)
buildPart("STS_Cizgisi_1", Vector3.new(-60, 1.1, -10), Vector3.new(60, 0.5, 2), "White", Enum.Material.SmoothPlastic)
buildPart("Denetim_Alani_Zemin", Vector3.new(0, 0.5, -80), Vector3.new(50, 1, 40), "Dark stone grey", Enum.Material.Concrete)

-- G) PAZAR YERİ VE TEZGAHLAR

for i = 1, 4 do
	buildPart("Tezgah_"..i, Vector3.new(60 + (i*10), 3, 50), Vector3.new(6, 4, 10), "Red reddish", Enum.Material.Wood)
end

-- H) BAHRİYE ENTEGRESİ VE STRATEJİK ADALAR
buildPart("Kocaman_Bahriye_Denizi", Vector3.new(0, -3, 500), Vector3.new(1600, 4, 600), "Bright blue", Enum.Material.Water)
buildPart("Ingiliz_Adasi_Zemin", Vector3.new(-300, 10, 500), Vector3.new(150, 20, 150), "Sand green", Enum.Material.Grass)
buildPart("Ingiliz_Kalesi_Bina", Vector3.new(-300, 30, 500), Vector3.new(50, 30, 50), "Medium stone grey", Enum.Material.Slate)
buildPart("Ulke_Kurma_Adasi_Zemin", Vector3.new(300, 10, 500), Vector3.new(180, 20, 180), "Dark green", Enum.Material.Grass)
local Direk = buildPart("Bayrak_Diregi", Vector3.new(300, 30, 500), Vector3.new(2, 40, 2), "White", Enum.Material.Iron)
local Bayrak = buildPart("Ada_Bayragi", Vector3.new(306, 45, 500), Vector3.new(10, 6, 1), "Really red", Enum.Material.Fabric)

-- -----------------------------------------------------------------------------
-- 3. ADIM: LIDERSTATS, 10 DAKİKADA BİR MAAŞ VE KAFADAKİ ÖRGÜT TAGI
-- -----------------------------------------------------------------------------
local OrgutSistemiData = {}

Players.PlayerAdded:Connect(function(player)
	local leaderstats = Instance.new("Folder")
	leaderstats.Name = "leaderstats"
	leaderstats.Parent = player

	local akce = Instance.new("IntValue")
	akce.Name = "Akçe"
	akce.Value = 1000
	akce.Parent = leaderstats

	local orgutVal = Instance.new("StringValue")
	orgutVal.Name = "Örgüt"
	orgutVal.Value = "Yok"
	orgutVal.Parent = player
	
	player.CharacterAdded:Connect(function(char)
		local head = char:WaitForChild("Head")
		local billboard = Instance.new("BillboardGui")
		billboard.Size = UDim2.new(0, 200, 0, 50)
		billboard.StudsOffset = Vector3.new(0, 3, 0)
		billboard.Name = "OrgutYazisiTag"
		
		local textLabel = Instance.new("TextLabel")
		textLabel.Size = UDim2.new(1, 0, 1, 0)
		textLabel.BackgroundTransparency = 1
		textLabel.TextColor3 = Color3.fromRGB(255, 215, 0)
		textLabel.TextScaled = true
		textLabel.Font = Enum.Font.SourceSansBold
		textLabel.Text = "Örgüt: " .. orgutVal.Value
		textLabel.Parent = billboard
		billboard.Parent = head
		
		orgutVal.Changed:Connect(function(newVal)
			textLabel.Text = "Örgüt: " .. newVal
		end)
	end)

	task.spawn(function()
		while task.wait(600) do
			if player and player:Parent then
				akce.Value = akce.Value + 250
			end
		end
	end)
end)

-- -----------------------------------------------------------------------------
-- 4. ADIM: AĞ BAĞLANTILARI VE SEVİYE ERİŞİMLERİ (REMOTE EVENTS)
-- -----------------------------------------------------------------------------
local HapisEvent = ReplicatedStorage:FindFirstChild("HapisEvent") or Instance.new("RemoteEvent")
HapisEvent.Name = "HapisEvent"
HapisEvent.Parent = ReplicatedStorage

local OrgutEvent = ReplicatedStorage:FindFirstChild("OrgutEvent") or Instance.new("RemoteEvent")
OrgutEvent.Name = "OrgutEvent"
OrgutEvent.Parent = ReplicatedStorage

HapisEvent.OnServerEvent:Connect(function(zaptiye, targetPlayerName, sure, sebep)
	if zaptiye.Team and zaptiye.Team.Name == "Zaptiye Amirliği" then
		local mahkum = Players:FindFirstChild(targetPlayerName)
		if mahkum and mahkum.Character then
			local eskiTakim = mahkum.Team
			mahkum.Team = Teams["Vatandaşlar / Örgütler"]
			mahkum.Character:MoveTo(HapisSpawnPart.Position + Vector3.new(0, 3, 0))
			
			task.wait(tonumber(sure) or 10)
			
			if mahkum and mahkum:Parent then
				mahkum.Team = eskiTakim
				local anaSpawn = workspace:FindFirstChild("SpawnLocation")
				if anaSpawn then mahkum.Character:MoveTo(anaSpawn.Position) end
			end
		end
	end
end)

OrgutEvent.OnServerEvent:Connect(function(player, action, orgutName, orgutAmac)
	if not player:FindFirstChild("leaderstats") or not player.leaderstats:FindFirstChild("Akçe") then return end
	local akce = player.leaderstats.Akçe
	if action == "Kur" and akce.Value >= 500 and player.Örgüt.Value == "Yok" then
		akce.Value = akce.Value - 500
		player.Örgüt.Value = orgutName
		OrgutSistemiData[orgutName] = {Lider = player.Name, Amac = orgutAmac, Uyeler = {player.Name}}
		OrgutEvent:FireAllClients("Guncelle", OrgutSistemiData)
	elseif action == "Katil" and OrgutSistemiData[orgutName] and player.Örgüt.Value == "Yok" then
		player.Örgüt.Value = orgutName
		table.insert(OrgutSistemiData[orgutName].Uyeler, player.Name)
		OrgutEvent:FireAllClients("Guncelle", OrgutSistemiData)
	end
end)

-- -----------------------------------------------------------------------------
-- 5. ADIM: EKRAN ARAYÜZLERİ (GUI) OTOMATİK YÜKLEME
-- -----------------------------------------------------------------------------
Players.PlayerAdded:Connect(function(player)
	player.CharacterAdded:Connect(function()
		local playerGui = player:WaitForChild("PlayerGui")
		if playerGui:FindFirstChild("EymenPasa_ArayuzSistemi") then return end
		
		local ScreenGui = Instance.new("ScreenGui")
		ScreenGui.Name = "EymenPasa_ArayuzSistemi"
		ScreenGui.ResetOnSpawn = false
		ScreenGui.Parent = playerGui

		-- KELEPÇE SİSTEMİ
		local KelepceBtn = Instance.new("TextButton")
		KelepceBtn.Size = UDim2.new(0, 55, 0, 55)
		KelepceBtn.Position = UDim2.new(0, 15, 0.5, -27)
		KelepceBtn.BackgroundColor3 = Color3.fromRGB(0, 70, 180)
		KelepceBtn.Text = "⛓️"
		KelepceBtn.TextSize = 28
		KelepceBtn.TextColor3 = Color3.new(1,1,1)
		KelepceBtn.Visible = false
		KelepceBtn.Parent = ScreenGui

		local HapisFrame = Instance.new("Frame")
		HapisFrame.Size = UDim2.new(0, 240, 0, 190)
		HapisFrame.Position = UDim2.new(0, 85, 0.5, -95)
		HapisFrame.BackgroundColor3 = Color3.fromRGB(35, 35, 35)
		HapisFrame.Visible = false
		HapisFrame.Parent = ScreenGui

		local InpSucluy = Instance.new("TextBox")
		InpSucluy.Size = UDim2.new(1, -20, 0, 30)
		InpSucluy.Position = UDim2.new(0, 10, 0, 10)
		InpSucluy.PlaceholderText = "Suçlu Oyuncu Adı..."
		InpSucluy.Parent = HapisFrame

		local InpSure = Instance.new("TextBox")
		InpSure.Size = UDim2.new(1, -20, 0, 30)
		InpSure.Position = UDim2.new(0, 10, 0, 45)
		InpSure.PlaceholderText = "Hapis Süresi..."
		InpSure.Parent = HapisFrame

		local InpSebep = Instance.new("TextBox")
		InpSebep.Size = UDim2.new(1, -20, 0, 30)
		InpSebep.Position = UDim2.new(0, 10, 0, 80)
		InpSebep.PlaceholderText = "Hapis Sebebi..."
		InpSebep.Parent = HapisFrame

		local BtnHapseAt = Instance.new("TextButton")
		BtnHapseAt.Size = UDim2.new(1, -20, 0, 35)
		BtnHapseAt.Position = UDim2.new(0, 10, 0, 120)
		BtnHapseAt.BackgroundColor3 = Color3.fromRGB(180, 0, 0)
		BtnHapseAt.Text = "CEZALANDIR"
		BtnHapseAt.TextColor3 = Color3.new(1,1,1)
		BtnHapseAt.Parent = HapisFrame

		task.spawn(function()
			while task.wait(2) do
				if player.Team and player.Team.Name == "Zaptiye Amirliği" then
					KelepceBtn.Visible = true
				else
					KelepceBtn.Visible = false
					HapisFrame.Visible = false
				end
			end
		end)

		KelepceBtn.MouseButton1Click:Connect(function() HapisFrame.Visible = not HapisFrame.Visible end)
		BtnHapseAt.MouseButton1Click:Connect(function()
			if InpSucluy.Text ~= "" and InpSure.Text ~= "" then
				HapisEvent:FireServer(InpSucluy.Text, InpSure.Text, InpSebep.Text)
				HapisFrame.Visible = false
			end
		end)

		-- ÖRGÜT MENÜSÜ
		local OrgutMenuBtn = Instance.new("TextButton")
		OrgutMenuBtn.Size = UDim2.new(0, 110, 0, 40)
		OrgutMenuBtn.Position = UDim2.new(1, -125, 0, 15)
		OrgutMenuBtn.BackgroundColor3 = Color3.fromRGB(20, 100, 20)
		OrgutMenuBtn.Text = "🍁 Örgüt Menüsü"
		OrgutMenuBtn.TextColor3 = Color3.new(1,1,1)
		OrgutMenuBtn.Font = Enum.Font.SourceSansBold
		OrgutMenuBtn.Parent = ScreenGui

		local OrgutFrame = Instance.new("Frame")
		OrgutFrame.Size = UDim2.new(0, 260, 0, 220)
		OrgutFrame.Position = UDim2.new(1, -285, 0, 65)
		OrgutFrame.BackgroundColor3 = Color3.fromRGB(45, 45, 45)
		OrgutFrame.Visible = false
		OrgutFrame.Parent = ScreenGui

		local TxOrgutIsim = Instance.new("TextBox")
		TxOrgutIsim.Size = UDim2.new(1, -20, 0, 30)
		TxOrgutIsim.Position = UDim2.new(0, 10, 0, 10)
		TxOrgutIsim.PlaceholderText = "Örgüt Adı gir..."
		TxOrgutIsim.Parent = OrgutFrame

		local TxOrgutAmac = Instance.new("TextBox")
		TxOrgutAmac.Size = UDim2.new(1, -20, 0, 30)
		TxOrgutAmac.Position = UDim2.new(0, 10, 0, 45)
		TxOrgutAmac.PlaceholderText = "Örgüt Amacı ne?..."
		TxOrgutAmac.Parent = OrgutFrame

		local BtnKurOnay = Instance.new("TextButton")
		BtnKurOnay.Size = UDim2.new(1, -20, 0, 35)
		BtnKurOnay.Position = UDim2.new(0, 10, 0, 85)
		BtnKurOnay.BackgroundColor3 = Color3.fromRGB(210, 140, 0)
		BtnKurOnay.Text = "ÖRGÜT KUR (500 AKÇE)"
		BtnKurOnay.TextColor3 = Color3.new(1,1,1)
		BtnKurOnay.Parent = OrgutFrame

		local ScrollList = Instance.new("ScrollingFrame")
		ScrollList.Size = UDim2.new(1, -20, 0, 75)
		ScrollList.Position = UDim2.new(0, 10, 0, 130)
		ScrollList.BackgroundColor3 = Color3.fromRGB(30, 30, 30)
		ScrollList.CanvasSize = UDim2.new(0, 0, 3, 0)
		ScrollList.Parent = OrgutFrame

		OrgutMenuBtn.MouseButton1Click:Connect(function() OrgutFrame.Visible = not OrgutFrame.Visible end)
		BtnKurOnay.MouseButton1Click:Connect(function()
			if TxOrgutIsim.Text ~= "" and TxOrgutAmac.Text ~= "" then
				OrgutEvent:FireServer("Kur", TxOrgutIsim.Text, TxOrgutAmac.Text)
				OrgutFrame.Visible = false
			end
		end)

		OrgutEvent.OnClientEvent:Connect(function(act, serverData)
			if act == "Guncelle" then
				for _, c in pairs(ScrollList:GetChildren()) do c:Destroy() end
				local yOffset = 0
				for oName, info in pairs(serverData) do
					local b = Instance.new("TextButton")
					b.Size = UDim2.new(1, 0, 0, 25)
					b.Position = UDim2.new(0, 0, 0, yOffset)
					b.BackgroundColor3 = Color3.fromRGB(60,60,60)
					b.Text = "Katıl: " .. oName
					b.TextColor3 = Color3.new(1,1,1)
					b.Parent = ScrollList
					b.MouseButton1Click:Connect(function()
						OrgutEvent:FireServer("Katil", oName)
						OrgutFrame.Visible = false
					end)
					yOffset = yOffset + 25
				end
			end
		end)
	end)
end)
    </textarea>
</div>

<script>
function copyScript() {
    var copyText = document.getElementById("robloxScript");
    copyText.select();
    copyText.setSelectionRange(0, 99999); /* Mobil cihazlar için */
    navigator.clipboard.writeText(copyText.value);
    alert("Roblox Script Başarıyla Kopyalandı! Developer arkadaşına ulaştırabilirsin paşam.");
}
</script>

</body>
